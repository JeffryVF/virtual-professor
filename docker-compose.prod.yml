# ═══════════════════════════════════════════════════════════════
# Virtual Professor — Production Deployment
# ═══════════════════════════════════════════════════════════════
# Production Docker Compose — use:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Hardens the stack for production:
#   - No port exposure for internal services
#   - Resource limits on all services
#   - Health checks with depends_on conditions
#   - Structured JSON logging
#   - Restart policy: unless-stopped
#   - Security options on all services
# ═══════════════════════════════════════════════════════════════

# ── Reusable logging anchor ────────────────────────────────────────────────
x-default-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ── Reusable security options ──────────────────────────────────────────────
x-security: &security
  security_opt:
    - "no-new-privileges:true"

# ── Resource limit presets ─────────────────────────────────────────────────
#   light    – nginx, redis, kokoro, langfuse:         cpus 0.5, memory 512M
#   medium   – backend, frontend:                       cpus 1,   memory 1G
#   heavy    – postgres, qdrant:                        cpus 1,   memory 2G
#   xheavy   – ollama, whisper:                         cpus 2,   memory 4G
# ───────────────────────────────────────────────────────────────────────────

x-light-limits: &light-limits
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: "512M"
      reservations:
        cpus: "0.1"
        memory: "64M"

x-medium-limits: &medium-limits
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: "1G"
      reservations:
        cpus: "0.25"
        memory: "256M"

x-heavy-limits: &heavy-limits
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: "2G"
      reservations:
        cpus: "0.25"
        memory: "512M"

x-xheavy-limits: &xheavy-limits
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: "4G"
      reservations:
        cpus: "0.5"
        memory: "1G"

# ── Services ───────────────────────────────────────────────────────────────

services:

  nginx:
    ports:
      - "80:80"
      - "443:443"
    <<: [*light-limits, *default-logging, *security]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    environment:
      - NODE_ENV=production
      - DEBUG=false
    expose:
      - "3000"
    <<: [*medium-limits, *default-logging, *security]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    environment:
      - DEBUG=false
    expose:
      - "8000"
    <<: [*medium-limits, *default-logging, *security]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      whisper:
        condition: service_healthy
      kokoro:
        condition: service_healthy

  whisper:
    <<: [*xheavy-limits, *default-logging, *security]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  qdrant:
    <<: [*heavy-limits, *default-logging, *security]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:6333/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  kokoro:
    <<: [*light-limits, *default-logging, *security]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    <<: [*heavy-limits, *default-logging, *security]
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    <<: [*light-limits, *default-logging, *security]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  langfuse-redis:
    <<: [*light-limits, *default-logging, *security]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  langfuse-postgres:
    <<: [*heavy-limits, *default-logging, *security]
    restart: unless-stopped

  langfuse:
    ports:
      - "3001:3000"
    <<: [*light-limits, *default-logging, *security]
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
