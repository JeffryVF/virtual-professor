# Development overrides — auto-applied when running `docker compose up`
# Provides hot-reload, exposed debug ports, and dev-mode commands.
# Production deployments should omit this file.

services:

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./services/frontend:/app
      - node_modules:/app/node_modules

  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./services/backend:/app
      - ./data/uploads:/app/uploads
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  whisper:
    ports:
      - "9000:9000"

  ollama:
    ports:
      - "11434:11434"

  qdrant:
    ports:
      - "6333:6333"

  kokoro:
    ports:
      - "8880:8880"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

volumes:
  node_modules:
