# Virtual Professor — Render Blueprint
# Render hosts the frontend, API, and a small volatile Redis cache.
# Supabase hosts the persistent PostgreSQL database.
# Cloudflare AI Search hosts document chunking, embeddings, and retrieval.
#
# After the first sync:
#   1. Set DATABASE_URL, ZAI_API_KEY, and Cloudflare AI Search vars
#   2. The frontend calls the API directly (NEXT_PUBLIC_API_URL is a build
#      arg pointing at this API's https://*.onrender.com URL)

services:
  - type: keyvalue
    name: virtual-professor-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: virtual-professor-api
    runtime: docker
    plan: free
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "false"
      - key: ROOT_PATH
        value: ""
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: virtual-professor-redis
          property: connectionString
      - key: ZAI_API_KEY
        sync: false
      - key: ZAI_BASE_URL
        value: https://api.z.ai/api/paas/v4
      - key: ZAI_LLM_MODEL
        value: glm-4.7-flash
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_AI_SEARCH_INSTANCE
        sync: false
      - key: EMBED_RESUME_ON_STARTUP
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LLM_MAX_TOKENS
        value: "350"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrator
      - key: CORS_ORIGINS
        value: '["https://virtual-professor-frontend.onrender.com"]'
      - key: RAG_MIN_RELEVANCE_SCORE
        value: "0.20"
      - key: RAG_RETRIEVAL_TOP_K
        value: "8"
      - key: UPLOAD_MAX_SIZE_MB
        value: "4"
      - key: SESSION_MEMORY_MESSAGES
        value: "10"
      - key: SESSION_TIMEOUT_MINUTES
        value: "30"
      - key: LANGFUSE_ENABLE
        value: "false"

  - type: web
    name: virtual-professor-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./services/frontend/Dockerfile.prod
    dockerContext: ./services/frontend
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://virtual-professor-api.onrender.com
